<svg xmlns="http://www.w3.org/2000/svg" width="480" height="56" viewBox="0 0 480 56" role="img" aria-label="Laptop fund: 0 of 1,000 dollars">
  <!-- Monthly update ritual (30 seconds):
       1. fill width  = round(raised / 1000 * 290)
       2. right-hand  text = "$<raised> / $1,000"
       3. aria-label  = "Laptop fund: <raised> of 1,000 dollars" -->
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="0.55" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#f38ba8"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="55" rx="14" fill="#1e1e2e" stroke="#313244"/>
  <text x="20" y="33.5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.08em" fill="#cdd6f4">LAPTOP FUND</text>
  <rect x="150" y="21" width="290" height="14" rx="7" fill="#313244"/>
  <rect x="150" y="21" width="1" height="14" rx="7" fill="url(#wave)"/>
  <text x="460" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a6adc8">$0 / $1,000</text>
</svg>
